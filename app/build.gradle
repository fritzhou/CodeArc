plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp'; id 'com.chaquo.python' }
android {
 namespace 'com.codearc.app'
 compileSdk 34
 defaultConfig {
  applicationId 'com.codearc.app'; minSdk 24; targetSdk 34; versionCode 7; versionName '0.7.0'
  ndk { abiFilters.addAll(["arm64-v8a", "armeabi-v7a", "x86_64"]) }
  python { pip { /* no third-party packages yet — Phase 4 ships the bare interpreter only */ } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildFeatures { viewBinding true }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 implementation 'androidx.core:core-ktx:1.13.1'
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.activity:activity-ktx:1.9.1'
 implementation 'androidx.fragment:fragment-ktx:1.8.2'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
 implementation 'androidx.core:core-splashscreen:1.0.1'
 implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.databinding:viewbinding:8.5.2'
 implementation 'androidx.datastore:datastore-preferences:1.1.1'
 // Do not declare chaquopy_java explicitly here. The com.chaquo.python plugin injects the
 // matching runtime automatically in a real Gradle build. Explicitly declaring it caused
 // :app:checkDebugDuplicateClasses in GitHub Actions because the same 15.0.1 JAR appeared twice.
 implementation 'androidx.room:room-runtime:2.8.4'
 implementation 'androidx.room:room-ktx:2.8.4'
 ksp 'androidx.room:room-compiler:2.8.4'
 implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
}
// CodeAssist uses module.toml / its own dependency resolver for on-device builds. Keep any
// CodeAssist-only dependency workaround there rather than duplicating Chaquopy's runtime in
// this real-Gradle dependency block.
